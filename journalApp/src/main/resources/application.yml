server:
  port: 8088
  # servlet:
  #   context-path: /v1

#logging: used for stop excuting log on console for UsersService File 
#  level:
#    net:google:journalApp:
#      journalApp:service:
#        UsersService: OFF

logging: 
  level:
    net:google:journalApp:
      journalApp:service:
        UsersService: OFF
    
    org:
      springframework:
        security: DEBUG
        jdbc:
          core: TRACE
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

spring:
  application:
    name: journalApp

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/journal_php_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        id:
          new_generator_mappings: false
        format_sql: true
